name: Publish to PyPI

# Fires when you push an annotated tag like `v0.1.0`.
# Workflow assumes PyPI Trusted Publishing is configured for this repo —
# no API token needed in repo secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # required for PyPI's OIDC-based "trusted publisher" flow

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cyberlog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install dist/cyberlog-*.whl
          /tmp/probe/bin/python -c "import cyberlog; print(cyberlog.__version__)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
