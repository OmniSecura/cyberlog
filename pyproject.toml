[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name            = "cyberlog-sdk"
description     = "Official Python SDK for CyberCore Logging — structured logs from any project with a single import."
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"
authors         = [{ name = "OmniSecura" }]
keywords        = [
    "logging", "structured-logging", "observability",
    "cybercore", "sdk", "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

# Single runtime dependency — kept intentionally tiny so cyberlog never
# becomes a load-time burden on the host application.
dependencies = [
    "httpx>=0.27",
]

# Version is sourced from cyberlog/_version.py — bump it there, never here.
dynamic = ["version"]

[project.optional-dependencies]
# Pulled in by `pip install cyberlog[dev]`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
    "bumpver>=2023.1129",
]

[project.urls]
Homepage      = "https://github.com/OmniSecura/cyberlog"
Documentation = "https://github.com/OmniSecura/cyberlog#readme"
Repository    = "https://github.com/OmniSecura/cyberlog"
Issues        = "https://github.com/OmniSecura/cyberlog/issues"
Changelog     = "https://github.com/OmniSecura/cyberlog/blob/main/CHANGELOG.md"

# ── Hatch build config ────────────────────────────────────────────────────────

[tool.hatch.version]
path = "cyberlog/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/cyberlog",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["cyberlog"]

# ── Tooling ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "Release {new_version}"
tag_message     = "v{new_version}"
tag_scope       = "default"
commit          = true
tag             = true
push            = true

[tool.bumpver.file_patterns]
"cyberlog/_version.py" = ['__version__ = "{version}"']
"pyproject.toml"       = ['current_version = "{version}"']

[tool.ruff]
line-length    = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]   # we keep long URL/example lines in docstrings
